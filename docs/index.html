<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Maxfield Link Overlay support and privacy information">
  <title>Maxfield Link Overlay</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #101820; color: #f4f7fa; }
    main { width: min(720px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.05; }
    p { color: #aabbc8; font-size: 1.05rem; line-height: 1.7; }
    a { color: #2ed6c3; }
    .card { margin-top: 32px; padding: 24px; border: 1px solid #2c4353; border-radius: 18px; background: #17232e; }
  </style>
</head>
<body>
  <main>
    <h1>Maxfield Link Overlay</h1>
    <p>An offline Android overlay for following portal-link plans generated by Maxfield.</p>
    <div class="card">
      <h2>Privacy</h2>
      <p>The app does not collect, transmit, sell, or share personal data. Imported plans stay on the device.</p>
      <p><a href="privacy.html">Read the Privacy Policy / 阅读隐私政策</a></p>
    </div>
    <p><a href="https://github.com/XClear0/Maxfield-Link-Overlay">Source code and support</a></p>
  </main>
</body>
</html>
